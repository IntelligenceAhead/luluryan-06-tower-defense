<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>塔防游戏 — 黑白线条版</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>🏯 塔防游戏</h1>
    <p class="subtitle">黑白线条版 · 第1步：地图与路径</p>
  </header>

  <main>
    <!-- 游戏画布：所有画面都在这里绘制 -->
    <canvas id="gameCanvas" width="960" height="576"></canvas>
    <!-- 状态栏：显示建塔结果（成功/失败原因） -->
    <p id="statusMessage" class="hint">🖱️ 点击空地建造炮塔 · 点击道路试试会怎样</p>
  </main>

  <!-- 注意加载顺序：先逻辑（game.js），再美术（render.js） -->
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
</body>
</html>
